name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
  push:
    branches:
      - main
      - changeset-release/**
  workflow_dispatch:

jobs:
  # Supported OpenCode host versions live in .github/opencode-versions.json.
  # Promotion = edit that file (docs/releasing.md). The compatibility canary
  # (.github/workflows/opencode-compatibility-canary.yml) resolves floating
  # versions itself and never blocks PRs; future automation can bump this file.
  versions:
    name: Supported OpenCode versions
    runs-on: ubuntu-latest
    outputs:
      pinned: ${{ steps.read.outputs.pinned }}
      v2: ${{ steps.read.outputs.v2 }}
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read supported OpenCode versions
        id: read
        run: |
          {
            echo "pinned=$(jq -r .pinned .github/opencode-versions.json)"
            echo "v2=$(jq -r .v2 .github/opencode-versions.json)"
            echo "matrix=$(jq -c '[.floor, .pinned] | unique' .github/opencode-versions.json)"
          } >>"$GITHUB_OUTPUT"

  # One tarball per run. Every package-facing job downloads and verifies this
  # exact file by SHA-256; nothing re-packs.
  build-package:
    name: Build package + source checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Pack package and record metadata
        id: pack
        run: |
          set -euo pipefail
          npm pack --json >pack-output.json
          FILENAME="$(jq -r '.[0].filename' pack-output.json)"
          SHA256="$(sha256sum "$FILENAME" | cut -d ' ' -f 1)"
          jq --arg sha256 "$SHA256" '.[0] + {sha256: $sha256}' pack-output.json >package-metadata.json
          echo "tarball=$(pwd)/$FILENAME" >>"$GITHUB_OUTPUT"
          echo "::notice title=Artifact identity::Tarball version ($FILENAME) is the changesets-managed package.json version — contents are built from this checkout. Run identity is the SHA-256 below."
          printf 'Tarball: %s\nSHA-256: %s\n' "$FILENAME" "$SHA256"

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test against the packed artifact
        env:
          PACKAGE_TARBALL: ${{ steps.pack.outputs.tarball }}
        run: bun run test

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-tarball
          path: |
            ${{ steps.pack.outputs.tarball }}
            package-metadata.json
          retention-days: 3

  # Windows: no native tmux/pty (MSYS2/WSL too fragile), so TUI render coverage
  # stays Linux-only in tui-e2e. This job keeps the host-realistic Windows
  # boundary: plugin install via real OpenCode, config registration, consumer
  # npm install, and raw server import. It must not re-pack, re-run source
  # checks, or import opencode-supabase/tui outside the OpenCode host.
  package-smoke:
    name: Windows install smoke (OpenCode ${{ needs.versions.outputs.pinned }})
    needs:
      - build-package
      - versions
    runs-on: windows-latest
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: package-tarball
          path: package

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install pinned OpenCode
        run: npm i -g opencode-ai@${{ needs.versions.outputs.pinned }}

      - name: Smoke plugin install (windows)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $metadata = Get-Content package/package-metadata.json | ConvertFrom-Json
          $tarball = Get-ChildItem package/*.tgz
          $actual = (Get-FileHash $tarball -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $metadata.sha256) { throw "tarball sha256 mismatch: expected $($metadata.sha256), got $actual" }
          Write-Host "Verified artifact: $($metadata.filename) sha256=$actual"

          $tempHome = Join-Path ([IO.Path]::GetTempPath()) ([guid]::NewGuid().ToString())
          New-Item -ItemType Directory -Path $tempHome -Force | Out-Null
          $env:USERPROFILE = $tempHome
          $env:APPDATA = Join-Path $tempHome 'AppData/Roaming'
          $env:LOCALAPPDATA = Join-Path $tempHome 'AppData/Local'

          $resolved = (Resolve-Path $tarball.FullName).Path -replace '\\','/'
          # Same `file:<path>` form the Linux tmux harness uses; the file:///
          # URL form is mis-parsed by OpenCode 1.17.x on Windows (treated as a
          # directory, manifest read fails).
          $spec = "file:$resolved"

          $workdir = Join-Path ([IO.Path]::GetTempPath()) ([guid]::NewGuid().ToString())
          New-Item -ItemType Directory -Path $workdir -Force | Out-Null
          Set-Location $workdir
          git init -q

          opencode plugin $spec
          $config = opencode debug config | ConvertFrom-Json
          Write-Host "Smoke spec: $spec"
          $config | Select-Object plugin, plugin_origins | ConvertTo-Json -Depth 10
          $matched = $config.plugin_origins | Where-Object { $_.spec -eq $spec -and $_.scope -eq 'local' }
          if (-not $matched) { throw "plugin origin not registered for $spec" }

          $consumer = Join-Path ([IO.Path]::GetTempPath()) ([guid]::NewGuid().ToString())
          New-Item -ItemType Directory -Path $consumer -Force | Out-Null
          Set-Location $consumer
          npm install $spec
          bun -e "await import('opencode-supabase/server'); console.log('packed server import ok')"

  tui-e2e:
    name: TUI render E2E (OpenCode ${{ matrix.opencode-version }})
    needs:
      - build-package
      - versions
    strategy:
      fail-fast: false
      matrix:
        opencode-version: ${{ fromJSON(needs.versions.outputs.matrix) }}
        include:
          - opencode-version: ${{ needs.versions.outputs.v2 }}
            opencode-package: '@opencode/cli'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: package-tarball
          path: package

      - name: Verify tarball SHA-256
        id: artifact
        run: |
          set -euo pipefail
          EXPECTED="$(jq -r .sha256 package/package-metadata.json)"
          TARBALL="package/$(jq -r .filename package/package-metadata.json)"
          echo "$EXPECTED  $TARBALL" | sha256sum -c -
          echo "tarball=$(pwd)/$TARBALL" >>"$GITHUB_OUTPUT"

      - name: Install OpenCode and tmux
        run: |
          npm install -g "${{ matrix.opencode-package || 'opencode-ai' }}@${{ matrix.opencode-version }}"
          sudo apt-get update
          sudo apt-get install -y tmux

      - name: Exercise packed TUI in OpenCode
        env:
          PACKAGE_TARBALL: ${{ steps.artifact.outputs.tarball }}
        run: scripts/test-opencode-tui-package.sh "$RUNNER_TEMP/tui-e2e"

      - name: Upload TUI diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-${{ matrix.opencode-version }}-tui-diagnostics
          path: ${{ runner.temp }}/tui-e2e
          retention-days: 7
          if-no-files-found: error

  # Required aggregate. The check name stays `core` so branch protection
  # (contexts: core, changeset-check) needs no changes while gating the full
  # package boundary.
  core-required:
    name: core
    needs:
      - build-package
      - package-smoke
      - tui-e2e
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check package boundary results
        run: |
          if [ "${{ needs.build-package.result }}" != "success" ] ||
            [ "${{ needs.package-smoke.result }}" != "success" ] ||
            [ "${{ needs.tui-e2e.result }}" != "success" ]; then
            exit 1
          fi

  changeset-check:
    runs-on: ubuntu-latest
    env:
      # Keep the required job green on release/no-changeset PRs while only running the real check for normal PRs.
      SHOULD_RUN_CHANGESET_CHECK: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no-changeset') && !startsWith(github.head_ref, 'changeset-release/') }}
    steps:
      - name: Checkout
        if: env.SHOULD_RUN_CHANGESET_CHECK == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        if: env.SHOULD_RUN_CHANGESET_CHECK == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        if: env.SHOULD_RUN_CHANGESET_CHECK == 'true'
        run: bun install --frozen-lockfile

      - name: Check for changeset
        if: env.SHOULD_RUN_CHANGESET_CHECK == 'true'
        run: bunx changeset status --since=origin/main
